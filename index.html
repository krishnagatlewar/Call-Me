<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wanna talk to Me!!!</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:
linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb,#a18cd1);
background-size:400% 400%;
animation:bgMove 10s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:520px;
padding:40px;
border-radius:30px;
backdrop-filter:blur(18px);
background:rgba(255,255,255,.2);
box-shadow:0 20px 50px rgba(0,0,0,.2);
text-align:center;
position:relative;
}

h1{
font-size:34px;
margin-bottom:20px;
color:white;
}

p{
color:white;
margin-bottom:40px;
font-size:18px;
}

.buttons{
position:relative;
height:170px;
}

button{
border:none;
padding:16px 35px;
font-size:18px;
border-radius:40px;
cursor:pointer;
transition:.3s;
font-weight:bold;
}

#yesBtn{
background:#00d084;
color:white;
}

#yesBtn:hover{
transform:scale(1.08);
}

#noBtn{
position:absolute;
background:#ff4d6d;
color:white;
left:60%;
top:30px;
}

.page{
display:none;
}

.active{
display:block;
}

input{
margin-top:15px;
width:100%;
padding:15px;
font-size:18px;
border:none;
border-radius:15px;
margin-bottom:20px;
}

#confirmBtn{
width:100%;
background:#7c3aed;
color:white;
}

#confirmBtn:hover{
transform:scale(1.03);
}

.successPage{
    position:relative;
    width:100%;
    height:75vh;
    overflow:hidden;
}

.successContent{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    width:90%;
    z-index:5;
}

.successContent h1{
    font-size:48px;
    color:white;
    margin-bottom:15px;
}

.successContent h2{
    color:white;
    font-size:30px;
    margin-bottom:20px;
}

.successContent p{
    color:white;
    font-size:20px;
    line-height:1.7;
}

.bigHeart{
    font-size:70px;
    margin-top:25px;
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

@keyframes fall{

    from{
        transform:translateY(-50px) rotate(0deg);
        opacity:1;
    }

    to{
        transform:translateY(900px) rotate(360deg);
        opacity:0;
    }

}

.heartContainer{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
}

</style>

</head>
<body>

<div class="card">

<div id="page1" class="page active">

<h1> Hey Cutieee!💜 </h1>

<p>Do you want to talk to Me?</p>

<div class="buttons">

<button id="yesBtn">Yes ❤️</button>

<button id="noBtn">No 🙈</button>

</div>

</div>

<div id="page2" class="page">

<h1>💕 Pick a Date & Time</h1>
<p>Choose when you'd like to talk to Me ❤️</p>


<label for="date" class="inputLabel">📅 Select Date</label>
<input type="date" id="date">

<label for="time" class="inputLabel">🕒 Select Time</label>
<input type="time" id="time">

<button id="confirmBtn">Confirm</button>

</div>

<div id="page3" class="page successPage">

    <div class="heartContainer"></div>

    <div class="successContent">
        <h1>💜 Yay!!</h1>

        <h2>I will wait for your call ❤️</h2>

        <p>
            Thank you for making my day a little more special.<br><br>
            Looking forward to talking with you Cutieee!✨
        </p>

        <div class="bigHeart">💖</div>

    </div>

</div>

</div>

<script>

let noClickCount = 0;
const noBtn=document.getElementById("noBtn");
const area=document.querySelector(".buttons");

function moveButton(){

const areaWidth=area.clientWidth;
const areaHeight=area.clientHeight;

const btnWidth=noBtn.offsetWidth;
const btnHeight=noBtn.offsetHeight;

const x=Math.random()*(areaWidth-btnWidth);
const y=Math.random()*(areaHeight-btnHeight);

noBtn.style.left=x+"px";
noBtn.style.top=y+"px";

}

noBtn.addEventListener("mouseenter",moveButton);
noBtn.addEventListener("click", (e) => {
    e.preventDefault();
    noClickCount++;
    moveButton();
});

document.getElementById("yesBtn").onclick=()=>{

document.getElementById("page1").classList.remove("active");
document.getElementById("page2").classList.add("active");

};

document.getElementById("confirmBtn").onclick = async () => {

    const date = document.getElementById("date").value;
    const time = document.getElementById("time").value;

    if (!date || !time) {
        alert("Please select both date and time.");
        return;
    }
	
	const browser = navigator.userAgent;

    const device =
        /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
            ? "Mobile"
            : "Desktop";

    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const localTime = new Date().toLocaleString();

    const screenSize = `${window.screen.width}x${window.screen.height}`;
	
	let ip = "Unknown";

    try {
        const response = await fetch("https://api.ipify.org?format=json");
        const result = await response.json();
        ip = result.ip;
    } catch (e) {
        console.log("Unable to fetch IP");
    }
	
    const data = {
        date,
        time,
        submittedAt: new Date().toISOString(),
        clickedNo: noClickCount > 0 ? "Yes" : "No",
        noClickCount,
        browser,
        device,
        timezone,
        localTime,
        screenSize,
        ip
    };

    localStorage.setItem("krishnaCall", JSON.stringify(data));

    const formData = new FormData();

	Object.keys(data).forEach(key => {
		formData.append(key, data[key]);
	});

	try {
		await fetch("https://script.google.com/macros/s/AKfycbxSKA844oYBXxCITbqqP5pytYSjRmWBJhG6akZsbGKUF1wUUOqds4Z9Yk4ZNNS4LT2FdQ/exec", {
			method: "POST",
			body: formData
		});
	} catch (e) {
    console.log(e);
	}

    document.getElementById("page2").classList.remove("active");
    document.getElementById("page3").classList.add("active");

    confetti({
        particleCount: 250,
        spread: 120,
        origin: { y: 0.6 }
    });
};

function createHeart(){

    const heart=document.createElement("div");

    heart.innerHTML="❤️";

    heart.style.position="absolute";
    heart.style.left=Math.random()*100+"%";
    heart.style.top="-30px";
    heart.style.fontSize=(20+Math.random()*25)+"px";
    heart.style.animation=`fall ${4+Math.random()*3}s linear forwards`;

    document.querySelector(".heartContainer").appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },7000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
